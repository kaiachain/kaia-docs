name: klaytn-docs-docusaurus prod deploy workflow
on:
  push:
    branches:
      - main

# Serialize prod deployments: concurrent runs race on `aws s3 sync --delete`
# against the same bucket and can leave it in a mixed state (see the Jul 2026
# empty-pages incident). cancel-in-progress must stay false — cancelling a run
# mid-sync would leave a partial deployment. GitHub keeps at most one pending
# run queued, so rapid consecutive merges collapse into a single trailing deploy.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    permissions:
      id-token: write
      contents: read
    runs-on: kaia-xlarge-runner

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures full Git history is fetched for correct timestamp calculation
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN_PROD }}
          role-session-name: SessionForKlaytnActions
          aws-region: ${{ secrets.AWS_REGION_PROD }}
          role-duration-seconds: 40000

      - name: Installing Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installing dependencies
        run: |
          npm ci
      - name: Clone kaia-sdk
        run: |
          git clone -b dev https://github.com/kaiachain/kaia-sdk.git
          cd kaia-sdk/documentation && npm install && cd -

      - name: Generate .mdx files
        env:
          RPC_SPEC_DIR: ../../web3rpc/yaml
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          cd kaia-sdk/documentation && bash generate-docs.sh split && cd -
          cd web3rpc && bash -x web3rpc.sh && cd -
      - name: Build static files
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # Umami disabled — analytics paused. Uncomment to resume; code is untouched.
          # UMAMI_SRC: ${{ secrets.UMAMI_SRC }}
          # UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          ALGOLIA_ASSISTANT_ID: ${{ secrets.ALGOLIA_ASSISTANT_ID }}
          FEEDBACK_PROJECT_ID: ${{ secrets.FEEDBACK_PROJECT_ID }}
          RATING_CONTENT_SET_ID: ${{ secrets.RATING_CONTENT_SET_ID }}
        run: npm run build

      - name: Sync to S3 bucket and validation cloudfront
        env:
          S3_BUCKET_PROD: ${{ secrets.S3_BUCKET_PROD }}
          CLOUDFRONT_ID_PROD: ${{ secrets.CLOUDFRONT_ID_PROD }}
        run: |
          HASHED=(--exclude "*" --include "assets/*")
          NOT_HASHED=(--exclude "assets/*")
          for l in ko ja zh-CN zh-TW vi; do HASHED+=(--include "$l/assets/*"); NOT_HASHED+=(--exclude "$l/assets/*"); done
          # 1) Content-hashed files (assets/): a filename never changes content, so compare by size
          #    only (skips re-uploading unchanged files every deploy) and cache them forever.
          aws s3 sync ./build/ $S3_BUCKET_PROD "${HASHED[@]}" --size-only \
            --cache-control "public,max-age=31536000,immutable"
          # 2) Everything else (HTML, sitemap, static img/files): normal sync with --delete.
          #    Old hashed assets are excluded from --delete so already-cached HTML keeps working.
          aws s3 sync ./build/ $S3_BUCKET_PROD --delete "${NOT_HASHED[@]}"
          aws s3 cp llms.txt $S3_BUCKET_PROD
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID_PROD --paths "/*"
